services:
  securityrestapi:
    image: docker.io/ryttelp/securityrestapi:latest

    container_name: securityrestapi

    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8080}:8080"

    environment:
      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Dodaj tu własne zmienne aplikacji, np.:
      # ConnectionStrings__DefaultConnection: "Server=host;Database=SecurityRestApi;User Id=sa;Password=pass;TrustServerCertificate=True"
      # Jwt__Secret: "twoj-bardzo-dlugi-i-losowy-sekret"
      # AllowedHosts: "*"

    healthcheck:
      # Zakłada że aplikacja ma endpoint /health (ASP.NET Core Health Checks)
      # Jeśli nie — zmień na: test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      #test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"